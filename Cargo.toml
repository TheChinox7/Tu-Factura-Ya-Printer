[package]
name = "tu-factura-ya-printer"
version = "1.0.4"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
barcoders = { version = "2", default-features = false }
base64 = "0.22"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
encoding_rs = "0.8"
getrandom = "0.4"
httparse = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "rustls", "platform-verifier"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
pdf-writer = "0.12"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.5"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["bmp"] }
windows = { version = "0.62", features = ["Data_Pdf", "Foundation", "Graphics_Imaging", "Storage_Streams", "UI", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security_Credentials", "Win32_Storage_Xps"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
